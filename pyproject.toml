[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"


[project]
name = "eko-design-system"
version = "0.0.0"
description = "The design system for alignment with EKO Instruments branding and visual identity."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "License :: Other/Proprietary License",
    "Framework :: Flask",
]
dependencies = []
authors = [
    {name = "Palau van Helden", email = "palau@vhelden.nl"}
]

[project.optional-dependencies]
# The Flask integration (eko_design_system.flask); the components themselves need nothing
flask = ["Flask>=2.3"]


# The package lives in python/, the assets in the repository root (shared with the PHP package).
# The wheel puts both together: the code in eko_design_system/, the assets in eko_design_system/static/assets/.
[tool.hatch.build.targets.wheel]
packages = ["python/eko_design_system"]

[tool.hatch.build.targets.wheel.force-include]
"assets/css" = "eko_design_system/static/assets/css"
"assets/js" = "eko_design_system/static/assets/js"
"assets/fonts" = "eko_design_system/static/assets/fonts"
"assets/icons" = "eko_design_system/static/assets/icons"

[tool.hatch.build.targets.sdist]
include = [
    "python/eko_design_system",
    "assets/css",
    "assets/js",
    "assets/fonts",
    "assets/icons",
    "README.md",
    "pyproject.toml",
]
